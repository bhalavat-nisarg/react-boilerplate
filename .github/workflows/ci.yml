name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm audit --package-lock-only --audit-level=low
      - run: npm run build
      - run: node internals/scripts/generate-templates-for-linting.js
      - run: npm test -- --runInBand --watch=false
      - run: node internals/scripts/smoke-server.js